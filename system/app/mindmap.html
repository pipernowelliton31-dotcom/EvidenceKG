<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence · 资料思维导图</title>
<style>
:root{color-scheme:dark;font-family:Bahnschrift,'Microsoft YaHei',sans-serif;color:#e5ecea;background:#080e15}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#16222c;border:1px solid #344b52;border-radius:7px;padding:9px 13px}header{padding:30px 36px 24px;border-bottom:1px solid #233038;display:flex;gap:22px;justify-content:space-between;align-items:center}header small{color:#68d7c6;letter-spacing:3px;font-size:10px}h1{font-size:28px;font-weight:500;margin:10px 0}header p{font-size:12px;color:#879ba5;line-height:1.7;margin:0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{background:#101c27;border:1px solid #34505a;border-radius:6px;padding:10px;color:#d8e9e3;width:180px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;height:calc(100dvh - 153px)}#viewport{overflow:auto;position:relative;background:radial-gradient(ellipse at 50% 30%,#17283377,transparent 70%),radial-gradient(#45616544 1px,transparent 1px);background-size:auto,28px 28px}#tree{position:relative;min-width:1100px;padding:65px 90px;transform-origin:0 0;display:grid;grid-template-columns:240px 220px 370px;gap:100px;align-items:center}#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.root,.branch,.leaf{position:relative;z-index:1;background:#10202a;border:1px solid #36525b;border-radius:13px;box-shadow:0 20px 60px #0003;text-align:left}.root{padding:25px;align-self:center;border-color:#5fb3a4;background:#132e30}.root .word{font-size:29px;letter-spacing:-1px;color:#86e4cb}.root h2{font-size:17px;line-height:1.8;font-weight:500;margin:16px 0 7px}.root p{font-size:11px;line-height:1.8;color:#96afb3}.branch{padding:20px;width:220px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}.branch b{display:block;font-size:18px}.branch small{display:block;color:#93a7ae;margin-top:10px;font-size:11px}.groups{display:flex;flex-direction:column;gap:50px}.group{display:grid;grid-template-columns:220px 370px;gap:100px;align-items:center}.leaves{display:grid;grid-template-columns:1fr 1fr;gap:12px}.leaf{padding:15px 13px;border-left:3px solid var(--accent);font-size:12px;line-height:1.65;min-height:76px}.leaf:hover,.leaf.selected{background:#203c40;border-color:var(--accent)}.leaf small{display:block;color:#78929c;font-size:9px;margin-top:5px}.leaf.match{box-shadow:0 0 25px #68e4c64d;border-color:#9bffe3}.leaf.filtered{opacity:.25}aside{padding:30px 24px;overflow:auto;background:#0e1721;border-left:1px solid #2a3c44}aside .kicker{font-size:9px;letter-spacing:2px;color:#65cdbd}aside h2{font-size:22px;font-weight:500;line-height:1.6;overflow-wrap:anywhere}aside p{font-size:12px;line-height:1.8;color:#96aab4}.relation{display:block;width:100%;text-align:left;margin:10px 0;line-height:1.8;font-size:12px}.relation b{color:#84e4cc}.relation.on{border-color:#68e4cb;background:#1c3b3b}.evidence{padding:16px 0;border-top:1px solid #263b44}.evidence strong{font-size:12px;font-weight:500;line-height:1.8}.evidence small{font-size:10px;display:block;color:#71c9bd;margin:6px 0}.evidence pre{font-family:inherit;font-size:11px;line-height:1.9;white-space:pre-wrap;color:#a5b9c0;overflow-wrap:anywhere}.notice{font-size:10px;color:#78929c;padding:16px 36px;background:#0e1923;border-top:1px solid #233a42}details{margin-top:16px;font-size:12px;color:#97b1b8}summary{cursor:pointer}ul{padding-left:16px;line-height:2}#empty{display:none;text-align:center;padding:40px;color:#8fa5ac}@media(max-width:800px){header{padding:22px;align-items:flex-start;flex-direction:column}h1{font-size:21px}.layout{height:auto;grid-template-columns:1fr}#viewport{height:65vh}aside{max-height:60vh;border-top:1px solid #34505a}.tools{gap:5px}.notice{padding:18px 22px}}@media(prefers-reduced-motion:no-preference){.leaf{transition:background .5s,opacity .5s,box-shadow .5s}.root{animation:reveal 1.4s cubic-bezier(.2,.8,.2,1)}@keyframes reveal{from{clip-path:inset(0 100% 0 0);transform:translateX(-40px)}to{clip-path:inset(0);transform:none}}}
#tree{min-width:1210px;width:max-content;align-items:start}.root{align-self:start;margin-top:150px}.group{align-items:start}.leaves[hidden]{display:none!important}.branch{box-shadow:0 10px 40px #0002}@media(max-width:800px){.root{margin-top:100px}}
.evidence img{display:block;width:100%;height:auto;border-radius:7px;margin:12px 0;background:#f6f8fa}
</style></head><body>
<header><div><small>EVIDENCE / SOURCE MIND MAP</small><h1 id="name"></h1><p id="stats"></p></div><div class="tools"><input id="search" aria-label="搜索主体" placeholder="搜索产品、工具或客户"><button id="collapse">展开分支</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><button id="reset">重置</button></div></header>
<div class="layout"><section id="viewport" aria-label="知识思维导图"><div id="tree"><svg id="lines"></svg><div class="root"><span class="word">evidence.</span><h2>从资料出发<br>让关联可见</h2><p>点击主体，查看真实业务关系与原文证据。连线按类别组织，事实关系在右侧独立呈现。</p></div><div class="groups" style="grid-column:2 / 4" id="groups"></div></div><div id="empty">当前资料没有可展示的主体关系</div></section><aside id="detail"><span class="kicker">READ THE RELATIONSHIPS</span><h2>选择一个主体</h2><p>资料已内嵌，无需联网。点击产品、工具、客户，查看关联方向、中文关系与来源位置。</p><details><summary>本导图的原始资料</summary><ul id="files"></ul></details></aside></div>
<div class="notice">导图分类连线仅表示阅读组织；右侧关系使用原图谱事实，保留方向与来源。该 HTML 可离线打开、搜索、展开和缩放。</div>
<script id="graph-data" type="application/json">__GRAPH_DATA__</script>
<script>
const hiddenStyle=document.createElement('style');hiddenStyle.textContent='[hidden]{display:none!important}';document.head.append(hiddenStyle);
const data=JSON.parse(document.getElementById('graph-data').textContent),nodes=new Map(data.nodes.map(n=>[n.id,n])),facts=new Map(data.facts.map(f=>[f.fact_id,f])),evidence=new Map(data.evidence.map(e=>[e.evidence_id,e]));
const colors={Product:'#eac67d',AITool:'#66e4d3',Actor:'#a897e7',Version:'#74b7e4'},groups=document.getElementById('groups'),tree=document.getElementById('tree'),detail=document.getElementById('detail');let zoom=1,collapsed=true;
const el=(tag,text,cls)=>{const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(cls)element.className=cls;return element;};
document.getElementById('name').textContent=data.name;document.getElementById('stats').textContent=`${data.nodes.length} 个业务主体 · ${data.edges.length} 条有证据的关系 · ${data.documents.filter(d=>d.role==='corpus').length} 份业务资料`;
data.documents.forEach(d=>document.getElementById('files').append(el('li',d.path+(d.role==='corpus'?' · 构图来源':' · 不参与构图'))));
function showEvidence(ids){const title=el('p','关系的原文依据');detail.append(title);[...new Set(ids)].forEach(id=>{const e=evidence.get(id);if(!e)return;const box=el('div',undefined,'evidence');box.append(el('strong',e.source),el('small',e.location||JSON.stringify(e.locator)),el('pre',e.quote||'请结合原始资料中的对应位置复核。'));if(data.images[e.source]){const image=el('img');image.src=data.images[e.source];image.alt=e.source;box.append(image);}detail.append(box);});}
function select(id){const n=nodes.get(id);if(!n)return;document.querySelectorAll('.leaf').forEach(e=>e.classList.toggle('selected',e.dataset.id===id));detail.replaceChildren(el('span','ENTITY / EVIDENCE','kicker'),el('h2',n.name),el('p',(data.types[n.type]||n.type)+' · '+(n.aliases||[]).join(' / ')));const related=data.edges.filter(e=>e.source===id||e.target===id);detail.append(el('p',`${related.length} 条业务关系 · 箭头表示原始方向`));related.forEach(e=>{const b=el('button',undefined,'relation');b.append(el('span',nodes.get(e.source).name+' → '),el('b',data.relations[e.predicate]||'其他关联'),el('span',' → '+nodes.get(e.target).name));b.onclick=()=>{detail.querySelectorAll('.relation').forEach(r=>r.classList.remove('on'));b.classList.add('on');detail.querySelectorAll('.evidence,.evidence-title').forEach(r=>r.remove());const ids=(e.fact_ids||[]).flatMap(fid=>facts.get(fid)?.evidence_ids||[]);const t=el('p','所选关系的原文依据','evidence-title');detail.append(t);[...new Set(ids)].forEach(id=>{const v=evidence.get(id);if(!v)return;const box=el('div',undefined,'evidence');box.append(el('strong',v.source),el('small',v.location||JSON.stringify(v.locator)),el('pre',v.quote||'原文片段未保存，请核对对应位置'));if(data.images[v.source]){const image=el('img');image.src=data.images[v.source];image.alt=v.source;box.append(image);}detail.append(box);});};detail.append(b);});if(!related.length){const ids=(n.attribute_claims||[]).flatMap(c=>c.evidence_ids||[]);showEvidence(ids);}detail.scrollTop=0;}
Object.keys(colors).forEach(type=>{const list=data.nodes.filter(n=>n.type===type).sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));if(!list.length)return;const group=el('div',undefined,'group'),branch=el('button',undefined,'branch'),leaves=el('div',undefined,'leaves');leaves.hidden=true;branch.style.setProperty('--accent',colors[type]);branch.append(el('b',data.types[type]),el('small',`${list.length} 个主体 · 点击展开或收起`));branch.onclick=()=>{leaves.hidden=!leaves.hidden;requestAnimationFrame(draw);};list.forEach(n=>{const leaf=el('button',undefined,'leaf');leaf.style.setProperty('--accent',colors[type]);leaf.dataset.id=n.id;leaf.append(el('span',n.name),el('small',`${data.edges.filter(e=>e.source===n.id||e.target===n.id).length} 条关系`));leaf.onclick=()=>select(n.id);leaves.append(leaf);});group.append(branch,leaves);groups.append(group);});
function draw(){const svg=document.getElementById('lines');svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${tree.offsetWidth} ${tree.offsetHeight}`);const root=tree.querySelector('.root');if(!root)return;const pos=e=>{let x=0,y=0;for(let p=e;p&&p!==tree;p=p.offsetParent){x+=p.offsetLeft;y+=p.offsetTop;}return{x,y,w:e.offsetWidth,h:e.offsetHeight};};const line=(a,b,color)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${a.x} ${a.y} C ${(a.x+b.x)/2} ${a.y}, ${(a.x+b.x)/2} ${b.y}, ${b.x} ${b.y}`);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','1.3');svg.append(p);};const r=pos(root);groups.querySelectorAll('.group').forEach(g=>{const b=g.querySelector('.branch'),bp=pos(b),color=getComputedStyle(b).getPropertyValue('--accent');line({x:r.x+r.w,y:r.y+r.h/2},{x:bp.x,y:bp.y+bp.h/2},color+'66');g.querySelectorAll('.leaf').forEach(l=>{if(l.closest('.leaves').hidden)return;const p=pos(l);line({x:bp.x+bp.w,y:bp.y+bp.h/2},{x:p.x,y:p.y+p.h/2},color+'44');});});}
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.leaf').forEach(l=>{const match=!q||l.textContent.toLowerCase().includes(q);l.classList.toggle('match',!!q&&match);l.classList.toggle('filtered',!match);if(q&&match)l.closest('.leaves').hidden=false;});const first=document.querySelector('.leaf.match');if(first)first.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});requestAnimationFrame(draw);};
function scale(v){zoom=Math.max(.45,Math.min(1.6,v));tree.style.zoom=zoom;requestAnimationFrame(draw);}document.getElementById('plus').onclick=()=>scale(zoom+.15);document.getElementById('minus').onclick=()=>scale(zoom-.15);document.getElementById('reset').onclick=()=>{scale(1);document.getElementById('viewport').scrollTo({left:0,top:0,behavior:'smooth'});};document.getElementById('collapse').onclick=e=>{collapsed=!collapsed;groups.querySelectorAll('.leaves').forEach(l=>l.hidden=collapsed);e.target.textContent=collapsed?'展开分支':'收起分支';requestAnimationFrame(draw);};if(!data.nodes.length)document.getElementById('empty').style.display='block';new ResizeObserver(draw).observe(tree);requestAnimationFrame(draw);
</script></body></html>
